name: Build and Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
      forceBeta:
        description: "Force beta"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5
      - name: Calculate version
        id: outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            V_NAME=$(echo ${{ github.event.release.tag_name }} | sed 's/^v//')
            echo "version=$V_NAME" >> "$GITHUB_OUTPUT"
          else
            V_NAME=$(go run -v ./cmd/internal/read_tag --ci --nightly)
            echo "version=$V_NAME" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: calculate_version
    strategy:
      matrix:
        include:
          # Naive-enabled builds (musl)
          - { os: linux, arch: amd64, naive: true }
          - { os: linux, arch: arm64, naive: true }
          - { os: linux, arch: "386", naive: true }
          - { os: linux, arch: arm, goarm: "7", naive: true }
          # Non-naive builds
          - { os: linux, arch: arm, goarm: "6" }
          - { os: linux, arch: mips64le }
          - { os: linux, arch: mipsle }
          - { os: linux, arch: s390x }
          - { os: linux, arch: ppc64le }
          - { os: linux, arch: riscv64 }
          - { os: linux, arch: loong64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5

      - name: Clone cronet-go
        if: matrix.naive
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Build
        run: |
          set -xeuo pipefail
          TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0'
          if [[ "${{ matrix.naive }}" == "true" ]]; then
            TAGS="${TAGS},with_naive_outbound,with_musl"
            export CGO_ENABLED=1
          else
            export CGO_ENABLED=0
          fi
          
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
          -ldflags "-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0" \
          ./cmd/sing-box
          
          # Архивируем результат
          cd dist
          ARCH_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm }}.tar.gz"
          tar -czf "$ARCH_NAME" sing-box
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.goarm }}
          path: dist/*.tar.gz

  release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: [calculate_version, build]
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.calculate_version.outputs.version }}
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
